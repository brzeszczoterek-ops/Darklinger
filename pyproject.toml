[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "v-core"
version = "3.10"
description = "Darklinger local agent framework powered by V"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "openai>=1.40.0",
    "python-dotenv>=1.0.1",
    "rich>=13.7.1",
    "typer>=0.12.3",

    "mcp>=1.2.0",
    "httpx>=0.27.0",
    "anyio>=4.4.0",

    "PyYAML>=6.0.2",
    "langdetect>=1.0.9",
    "starlette>=0.47,<2",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
full = [
    "playwright>=1.50",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["src"]

[project.scripts]
v-core = "v_core.main:main"
darklinger-control = "v_core.autonomy.cli:main"
darklinger-learning = "v_core.learning.cli:main"
darklinger-model = "v_core.model_loader.cli:main"
darklinger-ui = "v_core.ui.cli:main"
# One-cycle command compatibility for installations created before the rename.
paladyn-control = "v_core.autonomy.cli:main"
paladyn-learning = "v_core.learning.cli:main"
paladyn-model = "v_core.model_loader.cli:main"
paladyn-ui = "v_core.ui.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"v_core.ui" = ["static/*.html", "static/*.css", "static/*.js"]
